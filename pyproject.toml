[project]
name = "karaqueue"
version = "2.0.0"
description = "A karaoke queue for parties: rooms, a fair singer rotation and a big screen for the TV."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.31",
    "pydantic>=2",
    "segno>=1.6",
]

[project.urls]
Homepage = "https://github.com/mdbook/karaqueue"
Issues = "https://github.com/mdbook/karaqueue/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ui = ["playwright>=1.40"]

[project.scripts]
karaqueue = "karaqueue.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
karaqueue = ["static/*", "static/fonts/*"]
