# Run KaraQueue with `docker compose up -d`, then open http://localhost:8000.
# Settings go in .env (copy .env.example). See docs/install.md for the rest.
services:
  karaqueue:
    build: .
    container_name: karaqueue
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KARAQUEUE_MEDIA_DIR: ${KARAQUEUE_MEDIA_DIR-/media}
      KARAQUEUE_DOWNLOADS_DIR: ${KARAQUEUE_DOWNLOADS_DIR-/data/downloads}
      KARAQUEUE_RECORDINGS_DIR: ${KARAQUEUE_RECORDINGS_DIR-/data/recordings}
    volumes:
      - karaqueue-data:/data
      # Your karaoke songs. Drop ":ro" if you want to delete songs or save YouTube songs into it.
      - ./songs:/media:ro

volumes:
  karaqueue-data:
